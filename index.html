<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Udoy Rakin Free Tournament</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--white:#fff;
--black:#080808;
--ink:#111;
--gray:#f2f2f2;
--line:#ddd;
--muted:#777
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#fff;
color:#111;
min-height:100vh;
}

button,input{font:inherit}
button{cursor:pointer}

.splash{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:50;
animation:hide 1s ease 2.5s forwards
}

.splashBox{text-align:center}

.logo{
width:82px;
height:82px;
background:#080808;
color:#fff;
border-radius:24px;
display:grid;
place-items:center;
font-weight:900;
font-size:28px;
margin:auto;
box-shadow:0 15px 35px #bbb
}

.splash h1{
font-size:25px;
margin-top:18px
}

.splash p{
color:#777;
margin-top:7px
}

.bar{
width:180px;
height:4px;
background:#ddd;
margin:25px auto 0;
border-radius:9px;
overflow:hidden
}

.bar i{
display:block;
height:100%;
background:#080808;
animation:load 2.3s ease
}

@keyframes load{
from{width:0}
to{width:100%}
}

@keyframes hide{
to{
opacity:0;
visibility:hidden;
pointer-events:none
}
}

/* LOGIN FIX */
.login{
position:fixed;
inset:0;
width:100%;
height:100dvh;
min-height:100vh;
display:grid;
place-items:center;
padding:25px;
background:#fff;
overflow-y:auto;
overflow-x:hidden;
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
z-index:40;
}

.loginCard{
width:min(420px,100%);
background:#080808;
color:#fff;
border-radius:28px;
padding:30px;
box-shadow:0 20px 50px #bbb
}

.brand{
font-size:12px;
letter-spacing:3px;
font-weight:bold;
color:#aaa
}

.loginCard h2{
